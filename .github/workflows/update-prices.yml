name: Update prices

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 09:00 IST (03:30 UTC)
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python update_prices.py
      - run: python update_market.py
      - run: python backfill_history.py
      - name: Commit new data
        run: |
          git config user.name "price-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Price + market update $(date -u +%F)"
          git push
